[project]
name = "satellite-mesh-sim"
version = "0.1.0"
description = "LEO satellite constellation network simulator"
readme = "README.md"
authors = [
    { name = "abimundayat26", email = "abinav.mundayat@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "matplotlib",
    "pybind11",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
